<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Calculator Marja</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.panel-title {
  font-size: 18px;
  font-weight: bold;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
  text-align: center;
  cursor: pointer;
  background: #007aff;
  color: white;
  transition: all 0.3s ease;
}

.panel-title.active {
  background: #91FDBA;
  color: black;
}

.panel-title:hover {
  filter: brightness(1.1);
}

.panel {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s ease-out;
  margin-top: 10px;
}

.panel.open {
  max-height: 600px;
}

/* ✅ INPUT WITH PREFIX */
.input-group {
  position: relative;
  margin-bottom: 15px;
}

.input-group span {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-weight: bold;
  color: #555;
  pointer-events: none;
}

.input-group input {
  width: 100%;
  padding: 10px 10px 10px 110px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  background: #91FDBA;
  color: black;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

button:hover {
  opacity: 0.7;
  transform: scale(1.03);
  box-shadow: 0 5px 10px rgba(0,0,0,0.15);
}

.result {
  margin-top: 15px;
  font-size: 18px;
  text-align: center;
}

.result strong {
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- PANEL 1 -->
  <div class="panel-title" id="title1" onclick="togglePanel('panel1','title1')">
    Calcul Marja
  </div>

  <div class="panel" id="panel1">
    <div class="input-group"><span>PA</span><input id="pa" placeholder="Ex: 150"></div>
    <div class="input-group"><span>TVA%</span><input id="vat" placeholder="Ex: 21"></div>
    <div class="input-group"><span>PV</span><input id="pv" placeholder="Ex: 302,5"></div>
    <button onclick="calculateMJ()">Calculeaza Marja</button>
    <div class="result" id="result1"></div>
  </div>

  <!-- PANEL 2 -->
  <div class="panel-title" id="title2" onclick="togglePanel('panel2','title2')">
    Calcul Pret
  </div>

  <div class="panel" id="panel2">
    <div class="input-group"><span>PA</span><input id="pa2" placeholder="Ex: 150"></div>
    <div class="input-group"><span>TVA%</span><input id="vat2" placeholder="Ex: 21"></div>
    <div class="input-group"><span>Marja%</span><input id="marja2" placeholder="Ex: 25"></div>
    <button onclick="calculatePrice()">Calculeaza Pret</button>
    <div class="result" id="result2"></div>
  </div>

  <!-- PANEL 3 -->
  <div class="panel-title" id="title3" onclick="togglePanel('panel3','title3')">
    Calcul WES
  </div>

  <div class="panel" id="panel3">
    <div class="input-group"><span>CA</span><input id="ca3" placeholder="Ex: 10.200"></div>
    <div class="input-group"><span>Marja%</span><input id="marja3" placeholder="Ex: 35"></div>
    <div class="input-group"><span>TVA%</span><input id="vat3" placeholder="Ex: 21"></div>
    <button onclick="calculateWES()">Calculeaza WES</button>
    <div class="result" id="result3"></div>
  </div>

  <!-- PANEL 4 -->
  <div class="panel-title" id="title4" onclick="togglePanel('panel4','title4')">
    Calcul Rotatie
  </div>

  <div class="panel" id="panel4">
    <div class="input-group"><span>Vanzare:</span><input id="vanzare4" placeholder="Ex: 500 buc"></div>
    <div class="input-group"><span>Zile:</span><input id="zile4" placeholder="Ex: 55 zile sau 1,8 luni"></div>
    <div class="input-group"><span>Stoc:</span><input id="stoc4" placeholder="Ex: 750 buc"></div>
    <div class="input-group"><span>Perioada:</span><input id="perioada4" placeholder="Ex: 365 zile sau 12 luni"></div>
    <button onclick="calculateRotatie()">Calculeaza Rotatie</button>
    <div class="result" id="result4"></div>
  </div>

  <!-- PANEL 5 -->
  <div class="panel-title" id="title5" onclick="togglePanel('panel5','title5')">
    RL-Stoc Final
  </div>

  <div class="panel" id="panel5">
    <div class="input-group"><span>WES Actual</span><input id="wesActual5" placeholder="Ex: 5.522"></div>
    <div class="input-group"><span>PA Actual</span><input id="paActual5" placeholder="Ex: 2.603"></div>
    <div class="input-group"><span>WES Extrpl</span><input id="wesExtra5" placeholder="Ex: 1.424"></div>
    <div class="input-group"><span>OpenOrders</span><input id="openOrders5" placeholder="Ex: 1.038"></div>
    <div class="input-group"><span>In Delivery:</span><input id="delivery5" placeholder="Ex: 292"></div>
    <button onclick="calculateRL()">Calculeaza RL</button>
    <div class="result" id="result5"></div>
  </div>

</div>

<script>
function togglePanel(panelId, titleId) {
  let panels = document.querySelectorAll(".panel");
  let titles = document.querySelectorAll(".panel-title");

  panels.forEach(panel => {
    if(panel.id === panelId && !panel.classList.contains("open")) {
      panel.classList.add("open");
    } else {
      panel.classList.remove("open");
    }
  });

  titles.forEach(title => {
    if(title.id === titleId && document.getElementById(panelId).classList.contains("open")) {
      title.classList.add("active");
    } else {
      title.classList.remove("active");
    }
  });
}

function parseNumber(value) {
  return parseFloat(value.replace(/\./g, "").replace(",", "."));
}

function formatNumber(value) {
  return value.toLocaleString("ro-RO", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

// (ALL YOUR CALCULATIONS REMAIN EXACTLY THE SAME)

function calculateMJ() {
  let pa = parseNumber(document.getElementById("pa").value);
  let vatInput = parseNumber(document.getElementById("vat").value);
  let pv = parseNumber(document.getElementById("pv").value);

  if (isNaN(pa) || isNaN(vatInput) || isNaN(pv) || pv === 0) {
    document.getElementById("result1").innerText = "Valori invalide";
    return;
  }

  let vat = 1 + (vatInput / 100);
  let marja = 1 - (pa * vat / pv);

  document.getElementById("result1").innerText =
    "Marja: " + formatNumber(marja * 100) + "%";
}

function calculatePrice() {
  let pa = parseNumber(document.getElementById("pa2").value);
  let vatInput = parseNumber(document.getElementById("vat2").value);
  let marjaInput = parseNumber(document.getElementById("marja2").value);

  if (isNaN(pa) || isNaN(vatInput) || isNaN(marjaInput)) {
    document.getElementById("result2").innerText = "Valori invalide";
    return;
  }

  let vat = 1 + (vatInput / 100);
  let marja = 1 - (marjaInput / 100);

  let price = (pa * vat) / marja;

  document.getElementById("result2").innerText =
    "Pret: " + formatNumber(price);
}

function calculateWES() {
  let ca = parseNumber(document.getElementById("ca3").value);
  let marjaInput = parseNumber(document.getElementById("marja3").value);
  let vatInput = parseNumber(document.getElementById("vat3").value);

  if (isNaN(ca) || isNaN(marjaInput) || isNaN(vatInput)) {
    document.getElementById("result3").innerText = "Valori invalide";
    return;
  }

  let vat = 1 + (vatInput / 100);
  let marjaFactor = 1 - (marjaInput / 100);

  let base = ca / vat;
  let wes = base * marjaFactor;

  document.getElementById("result3").innerText =
    "WES: " + formatNumber(wes);
}

function calculateRotatie() {
  let vanzare = parseNumber(document.getElementById("vanzare4").value);
  let stoc = parseNumber(document.getElementById("stoc4").value);
  let zile = parseNumber(document.getElementById("zile4").value);
  let perioada = parseNumber(document.getElementById("perioada4").value);

  if (isNaN(vanzare) || isNaN(stoc) || isNaN(zile) || isNaN(perioada) || stoc === 0) {
    document.getElementById("result4").innerText = "Valori invalide";
    return;
  }

  let rata = vanzare / zile;
  let proiectie = perioada * rata;
  let rotatie = proiectie / stoc;
  let cota = vanzare / (vanzare + stoc);

  document.getElementById("result4").innerHTML =
    "Cota Vanzare: " + formatNumber(cota * 100) + "%<br>" +
    "Rata Vanzare: " + formatNumber(rata) + "<br>" +
    "Proiectie Vanzare: " + formatNumber(proiectie) + "<br><br>" +
    "<strong>ROTATIE STOC: " + formatNumber(rotatie) + "</strong>";
}

function calculateRL() {
  let wesActual = parseNumber(document.getElementById("wesActual5").value);
  let paActual = parseNumber(document.getElementById("paActual5").value);
  let wesExtra = parseNumber(document.getElementById("wesExtra5").value);
  let openOrders = parseNumber(document.getElementById("openOrders5").value);
  let delivery = parseNumber(document.getElementById("delivery5").value);

  if (isNaN(wesActual) || isNaN(paActual) || isNaN(wesExtra) || isNaN(openOrders) || isNaN(delivery)) {
    document.getElementById("result5").innerText = "Valori invalide";
    return;
  }

  let result = paActual - wesExtra + openOrders + delivery;
  let percent = result / (wesActual + wesExtra);

  document.getElementById("result5").innerHTML =
    "Valoare: " + formatNumber(result) + "<br><br>" +
    "<strong>Procent: " + formatNumber(percent * 100) + "%</strong>";
}
</script>

</body>
</html>
