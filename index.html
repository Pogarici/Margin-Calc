<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Calculator Marja</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.panel-title {
  font-size: 18px;
  font-weight: bold;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
  text-align: center;
  cursor: pointer;
  background: #007aff;
  color: white;
  transition: all 0.3s ease;
}

.panel-title.active {
  background: #91FDBA;
  color: black;
}

.panel-title:hover {
  filter: brightness(1.1);
}

.panel {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.3s ease-out;
  margin-top: 10px;
}

.panel.open {
  max-height: 600px;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0 15px 0;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  background: #91FDBA;
  color: black;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}

button:hover {
  opacity: 0.7;
  transform: scale(1.03);
  box-shadow: 0 5px 10px rgba(0,0,0,0.15);
}

.result {
  margin-top: 15px;
  font-size: 18px;
  text-align: center;
}

.result strong {
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">

  <!-- PANEL 1 -->
  <div class="panel-title" id="title1" onclick="togglePanel('panel1','title1')">
    Calcul Marja
  </div>

  <div class="panel" id="panel1">
    <input id="pa" placeholder="PA (Ex: 150)">
    <input id="vat" placeholder="TVA % (Ex: 21)">
    <input id="pv" placeholder="PV (Ex: 302,5)">
    <button onclick="calculateMJ()">Calculeaza Marja</button>
    <div class="result" id="result1"></div>
  </div>

  <!-- PANEL 2 -->
  <div class="panel-title" id="title2" onclick="togglePanel('panel2','title2')">
    Calcul Pret
  </div>

  <div class="panel" id="panel2">
    <input id="pa2" placeholder="PA (Ex: 150)">
    <input id="vat2" placeholder="TVA % (Ex: 21)">
    <input id="marja2" placeholder="Marja % (Ex: 25)">
    <button onclick="calculatePrice()">Calculeaza Pret</button>
    <div class="result" id="result2"></div>
  </div>

  <!-- PANEL 3 -->
  <div class="panel-title" id="title3" onclick="togglePanel('panel3','title3')">
    Calcul WES
  </div>

  <div class="panel" id="panel3">
    <input id="ca3" placeholder="Cifra Afaceri / Vanzare (Ex: 10.200)">
    <input id="marja3" placeholder="Marja Vanzare % (Ex: 35)">
    <input id="vat3" placeholder="TVA % (Ex: 21)">
    <button onclick="calculateWES()">Calculeaza WES</button>
    <div class="result" id="result3"></div>
  </div>

  <!-- PANEL 4 -->
  <div class="panel-title" id="title4" onclick="togglePanel('panel4','title4')">
    Calcul Rotatie
  </div>

  <div class="panel" id="panel4">
    <input id="vanzare4" placeholder="Vanzare Buc. (Ex: 500)">
    <input id="zile4" placeholder="Zile/Luni vanzare acumulata">
    <input id="stoc4" placeholder="Stoc (Ex: 750)">
    <input id="perioada4" placeholder="Perioada Totala Analiza">
    <button onclick="calculateRotatie()">Calculeaza Rotatie</button>
    <div class="result" id="result4"></div>
  </div>

  <!-- ✅ PANEL 5 NEW -->
  <div class="panel-title" id="title5" onclick="togglePanel('panel5','title5')">
    RL-Stoc Final
  </div>

  <div class="panel" id="panel5">
    <input id="wesActual5" placeholder="WES Actual (Ex: 5.522)">
    <input id="paActual5" placeholder="PA Actual (Ex: 2.603)">
    <input id="wesExtra5" placeholder="WES Extrapolat (Ex: 1.424)">
    <input id="openOrders5" placeholder="OpenOrders (Ex: 1.038)">
    <input id="delivery5" placeholder="In Delivery (Ex: 292)">
    <button onclick="calculateRL()">Calculeaza RL</button>
    <div class="result" id="result5"></div>
  </div>

</div>

<script>
function togglePanel(panelId, titleId) {
  let panels = document.querySelectorAll(".panel");
  let titles = document.querySelectorAll(".panel-title");

  panels.forEach(panel => {
    if(panel.id === panelId && !panel.classList.contains("open")) {
      panel.classList.add("open");
    } else {
      panel.classList.remove("open");
    }
  });

  titles.forEach(title => {
    if(title.id === titleId && document.getElementById(panelId).classList.contains("open")) {
      title.classList.add("active");
    } else {
      title.classList.remove("active");
    }
  });
}

function parseNumber(value) {
  return parseFloat(value.replace(/\./g, "").replace(",", "."));
}

function formatNumber(value) {
  return value.toLocaleString("ro-RO", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

/* PANEL 5 NEW */
function calculateRL() {
  let wesActual = parseNumber(document.getElementById("wesActual5").value);
  let paActual = parseNumber(document.getElementById("paActual5").value);
  let wesExtra = parseNumber(document.getElementById("wesExtra5").value);
  let openOrders = parseNumber(document.getElementById("openOrders5").value);
  let delivery = parseNumber(document.getElementById("delivery5").value);

  if (
    isNaN(wesActual) ||
    isNaN(paActual) ||
    isNaN(wesExtra) ||
    isNaN(openOrders) ||
    isNaN(delivery)
  ) {
    document.getElementById("result5").innerText = "Valori invalide";
    return;
  }

  let result = paActual - wesExtra + openOrders + delivery;
  let percent = result / (wesActual + wesExtra);

  document.getElementById("result5").innerHTML =
    "Valoare: " + formatNumber(result) + "<br><br>" +
    "<strong>Procent: " + formatNumber(percent * 100) + "%</strong>";
}

/* ENTER SUPPORT */
document.querySelectorAll("input").forEach(input => {
  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {

      if (document.getElementById("panel1").classList.contains("open")) {
        calculateMJ();
      } 
      else if (document.getElementById("panel2").classList.contains("open")) {
        calculatePrice();
      } 
      else if (document.getElementById("panel3").classList.contains("open")) {
        calculateWES();
      } 
      else if (document.getElementById("panel4").classList.contains("open")) {
        calculateRotatie();
      }
      else if (document.getElementById("panel5").classList.contains("open")) {
        calculateRL();
      }

    }
  });
});
</script>

</body>
</html>
