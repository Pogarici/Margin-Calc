<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MJ Calculator</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.panel-title {
  font-size: 18px;
  font-weight: bold;
  padding: 10px;
  background: #007aff;
  color: white;
  border-radius: 8px;
  margin-top: 10px;
  text-align: center;
}

.panel {
  display: none;
  margin-top: 10px;
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0 15px 0;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  background: #007aff;
  color: white;
  border: none;
  border-radius: 8px;
}

.result {
  margin-top: 15px;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}
</style>

</head>
<body>

<div class="container">

  <!-- PANEL 1 -->
  <div class="panel-title" onclick="togglePanel('panel1')">
    Margin Calculator (MJ)
  </div>

  <div class="panel" id="panel1">
    <input id="ek" placeholder="EK (150)">
    <input id="vat" placeholder="VAT % (21)">
    <input id="sp" placeholder="SP (302,5)">
    <button onclick="calculateMJ()">Calculate MJ</button>
    <div class="result" id="result1"></div>
  </div>

  <!-- PANEL 2 -->
  <div class="panel-title" onclick="togglePanel('panel2')">
    Price Calculator
  </div>

  <div class="panel" id="panel2">
    <input id="ek2" placeholder="EK (150)">
    <input id="vat2" placeholder="VAT % (21)">
    <input id="mj2" placeholder="MJ % (25)">
    <button onclick="calculatePrice()">Calculate Price</button>
    <div class="result" id="result2"></div>
  </div>

</div>

<script>
function togglePanel(id) {
  let panel = document.getElementById(id);
  panel.style.display = (panel.style.display === "block") ? "none" : "block";
}

function parseNumber(value) {
  return parseFloat(
    value.replace(/\./g, "").replace(",", ".")
  );
}

function formatNumber(value) {
  return value.toLocaleString("de-DE", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

// PANEL 1 LOGIC
function calculateMJ() {
  let ek = parseNumber(document.getElementById("ek").value);
  let vatInput = parseNumber(document.getElementById("vat").value);
  let sp = parseNumber(document.getElementById("sp").value);

  if (isNaN(ek) || isNaN(vatInput) || isNaN(sp) || sp === 0) {
    document.getElementById("result1").innerText = "Invalid values";
    return;
  }

  let vat = 1 + (vatInput / 100);
  let mj = 1 - (ek * vat / sp);

  document.getElementById("result1").innerText =
    "MJ: " + formatNumber(mj * 100) + " %";
}

// PANEL 2 LOGIC (your formula)
function calculatePrice() {
  let ek = parseNumber(document.getElementById("ek2").value);
  let vatInput = parseNumber(document.getElementById("vat2").value);
  let mjInput = parseNumber(document.getElementById("mj2").value);

  if (isNaN(ek) || isNaN(vatInput) || isNaN(mjInput)) {
    document.getElementById("result2").innerText = "Invalid values";
    return;
  }

  let vat = 1 + (vatInput / 100);
  let mj = 1 - (mjInput / 100); // 25% → 0.75

  let price = (ek * vat) / mj;

  document.getElementById("result2").innerText =
    "Price: " + formatNumber(price);
}
</script>

</body>
</html>
